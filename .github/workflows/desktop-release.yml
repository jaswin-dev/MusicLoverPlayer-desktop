name: Build and publish desktop updates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/desktop-release.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS ARM64
            os: macos-latest
            command: dist:mac
            platform_key: mac-arm64
            metadata: latest-mac.yml
          - platform: Windows x64
            os: windows-latest
            command: dist:win
            platform_key: windows-x64
            metadata: latest.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set desktop version
        id: version
        shell: bash
        run: |
          VERSION_CODE="$((GITHUB_RUN_NUMBER + 1))"
          VERSION_NAME="1.0.${VERSION_CODE}"
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          npm version "${VERSION_NAME}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Generate Windows icon from build/icon.png
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("build/icon.png")
          target = Path("build/icon.ico")
          image = Image.open(source).convert("RGBA")
          if image.width < 256 or image.height < 256:
              raise SystemExit(f"build/icon.png must be at least 256x256; got {image.width}x{image.height}")
          image.save(target, format="ICO", sizes=[
              (16, 16), (24, 24), (32, 32), (48, 48),
              (64, 64), (128, 128), (256, 256)
          ])
          print(f"Generated {target} from {source}: {image.width}x{image.height}")
          PY

      - name: Build installer
        run: npm run ${{ matrix.command }} -- --publish never

      - name: Prepare platform update metadata
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM_KEY: ${{ matrix.platform_key }}
          RELEASE_TAG: desktop-v${{ steps.version.outputs.version }}
          METADATA: ${{ matrix.metadata }}
        run: |
          test -s "dist/$METADATA"
          python scripts/prepare-desktop-feed.py "dist/$METADATA"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform_key }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish combined desktop release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows and macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true

      - name: Publish one release with both platforms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: 1.0.${{ github.run_number + 1 }}
          REPOSITORY: jaswin-dev/MusicLoverPlayer-desktop
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="desktop-v${VERSION}"
          ASSETS=()
          for file in release-assets/*.dmg release-assets/*.zip release-assets/*.exe release-assets/*.blockmap; do
            [ -f "$file" ] && ASSETS+=("$file")
          done
          [ "${#ASSETS[@]}" -gt 0 ] || { echo "::error::No installer assets found"; exit 1; }

          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --repo "$REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --repo "$REPOSITORY" \
              --title "MusicLover Player ${VERSION}" \
              --notes "Desktop release ${VERSION} for Windows x64 and macOS ARM64."
          fi

          for METADATA in latest.yml latest-mac.yml; do
            FILE="release-assets/$METADATA"
            [ -s "$FILE" ] || { echo "::error::Missing $FILE"; exit 1; }
            CONTENT="$(base64 < "$FILE" | tr -d '\n')"
            SHA="$(gh api "repos/$REPOSITORY/contents/$METADATA?ref=main" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$SHA" ] && [ "$SHA" != "null" ]; then
              gh api --method PUT "repos/$REPOSITORY/contents/$METADATA" \
                -f message="Publish desktop update ${VERSION}: $METADATA" \
                -f content="$CONTENT" -f sha="$SHA" -f branch=main
            else
              gh api --method PUT "repos/$REPOSITORY/contents/$METADATA" \
                -f message="Publish desktop update ${VERSION}: $METADATA" \
                -f content="$CONTENT" -f branch=main
            fi
          done
