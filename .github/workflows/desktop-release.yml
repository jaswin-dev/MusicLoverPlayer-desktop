name: Build and publish desktop releases

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example 1.0.3)
        required: true
        default: 1.0.3
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            command: dist:mac
          - platform: Windows
            os: windows-latest
            command: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set release version
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Generate app icons
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python scripts/generate-icons.py
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            iconutil -c icns build/icon.iconset -o build/icon.icns
          fi

      - name: Build installers
        run: npm run ${{ matrix.command }} -- --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.yaml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: MusicLover Player ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
