name: Build and publish desktop updates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/desktop-release.yml"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }} installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS ARM64
            os: macos-latest
            command: dist:mac
            platform_key: mac-arm64
            metadata: latest-mac.yml
          - platform: Windows x64
            os: windows-latest
            command: dist:win
            platform_key: windows-x64
            metadata: latest.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set desktop version
        id: version
        shell: bash
        run: |
          VERSION_CODE="$((GITHUB_RUN_NUMBER + 1))"
          VERSION_NAME="1.0.${VERSION_CODE}"
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          npm version "${VERSION_NAME}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm install

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python scripts/generate-icons.py
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Generate Windows icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --quiet Pillow
          python scripts/generate-icons.py

      - name: Build installer
        run: npm run ${{ matrix.command }} -- --publish never

      - name: Validate update metadata
        shell: bash
        env:
          EXPECTED_METADATA: ${{ matrix.metadata }}
        run: |
          test -s "dist/$EXPECTED_METADATA"
          echo "Verified dist/$EXPECTED_METADATA"

      - name: Prepare platform update metadata
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM_KEY: ${{ matrix.platform_key }}
          RELEASE_TAG: desktop-v${{ steps.version.outputs.version }}-${{ matrix.platform_key }}
          METADATA: ${{ matrix.metadata }}
        run: |
          python scripts/prepare-desktop-feed.py "dist/$METADATA"

      - name: Publish installers and platform update metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.UPDATE_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PLATFORM_KEY: ${{ matrix.platform_key }}
          RELEASE_TAG: desktop-v${{ steps.version.outputs.version }}-${{ matrix.platform_key }}
          METADATA: ${{ matrix.metadata }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Missing UPDATE_REPO_TOKEN secret in the private desktop source repository"
            exit 1
          fi

          ASSETS=()
          for file in dist/*.dmg dist/*.zip dist/*.exe dist/*.blockmap; do
            [ -f "$file" ] && ASSETS+=("$file")
          done
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::No desktop installer assets were produced"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo jaswin-dev/musiclover-updates >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --repo jaswin-dev/musiclover-updates --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --repo jaswin-dev/musiclover-updates \
              --title "MusicLover Player $VERSION ($PLATFORM_KEY)" \
              --notes "Desktop update $VERSION for $PLATFORM_KEY"
          fi

          MANIFEST_PATH="desktop/$METADATA"
          MANIFEST_CONTENT="$(base64 < "dist/$METADATA" | tr -d '\n')"
          EXISTING_SHA="$(gh api "/repos/jaswin-dev/musiclover-updates/contents/$MANIFEST_PATH?ref=main" --jq '.sha' 2>/dev/null || true)"

          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "null" ]; then
            gh api --method PUT "/repos/jaswin-dev/musiclover-updates/contents/$MANIFEST_PATH" \
              -f message="Publish $PLATFORM_KEY desktop update $VERSION" \
              -f content="$MANIFEST_CONTENT" -f sha="$EXISTING_SHA" -f branch=main
          else
            gh api --method PUT "/repos/jaswin-dev/musiclover-updates/contents/$MANIFEST_PATH" \
              -f message="Publish $PLATFORM_KEY desktop update $VERSION" \
              -f content="$MANIFEST_CONTENT" -f branch=main
          fi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform_key }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
